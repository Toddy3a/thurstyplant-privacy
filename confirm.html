<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Email confirmed - ThurstyPlant</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f1f7ee; color: #222; display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
    .card { max-width: 420px; width: 100%; background: #fff; border: 1px solid #dcebd5; border-radius: 16px; overflow: hidden; text-align: center; }
    .head { background: #0d5c2e; color: #fff; padding: 26px 16px; font-size: 26px; font-weight: 800; letter-spacing: 1px; }
    .head span { color: #7fe08a; }
    .body { padding: 28px 24px 32px; }
    h1 { font-size: 21px; color: #0d5c2e; margin: 0 0 10px; }
    p { font-size: 15px; line-height: 1.6; color: #555; margin: 0 0 18px; }
    a.btn { display: inline-block; background: #1fb866; color: #06210f; font-weight: bold; font-size: 16px; text-decoration: none; padding: 14px 32px; border-radius: 12px; }
    .small { font-size: 13px; color: #888; margin-top: 18px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="head">🌱 THURSTY<span>PLANT</span></div>
    <div class="body">
      <h1>Your email is confirmed</h1>
      <p>Tap the button to open ThurstyPlant. You'll be signed in automatically.</p>
      <a id="open" class="btn" href="thurstyplant://auth/callback">Open ThurstyPlant</a>
      <p class="small">If nothing happens, make sure you opened this page on the phone where ThurstyPlant is installed.</p>
    </div>
  </div>
  <script>
    // Pass the sign-in details (after the # in this page's address) on to the app.
    var target = "thurstyplant://auth/callback" + (window.location.hash || "");
    document.getElementById("open").setAttribute("href", target);
    // Try to open the app right away; the button covers phones that block this.
    setTimeout(function () { window.location.href = target; }, 400);
  </script>
</body>
</html>
